[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "roadmaps"
version = "0.1.0"
description = "A Python library for structured roadmap files"
readme = "README.md"
license = "MIT"
authors = [
  { name = "octanima-labs", email = "34071457+octanima-labs@users.noreply.github.com" },
]
requires-python = ">=3.11"
keywords = ["planning", "roadmap", "tasks"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [

]

[project.urls]
Repository = "https://github.com/octanima-labs/roadmaps"
Documentation = "https://github.com/octanima-labs/roadmaps#readme"
Issues = "https://github.com/octanima-labs/roadmaps/issues"

[dependency-groups]
dev = [
  "build",
  "mypy",
  "pytest",
  "ruff",
]
docs = [
  "myst-parser",
  "pydata-sphinx-theme",
  "sphinx",
  "sphinx-autodoc-typehints",
]

[tool.ruff]
target-version = "py311"

[tool.mypy]
python_version = "3.11"

[[tool.mypy.overrides]]
module = ["tuning"]
ignore_missing_imports = true

[tool.hatch.envs.default]
dependencies = [
  "build",
  "mypy",
  "pytest",
  "ruff",
]

[tool.hatch.envs.docs]
dependencies = [
  "myst-parser",
  "pydata-sphinx-theme",
  "sphinx",
  "sphinx-autodoc-typehints",
]

[tool.hatch.envs.docs.scripts]
build = "sphinx-build -W -b html docs docs/_build/html"

[tool.hatch.build.targets.wheel]
packages = ["src/roadmaps"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
